[project]
name = "ai-automate-script"
version = "0.1.0"
description = "游戏环境自主 Agent 研究框架：Environment 三方法抽象（capture/act/check）+ SoM 编号感知 + LLM 单步决策闭环"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Automate Team"}
]
keywords = ["automation", "agent", "pyautogui", "ocr", "llm"]

dependencies = [
    "ollama>=0.4.0",
    "easyocr>=1.7.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "opencv-python>=4.9.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
