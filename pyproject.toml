[project]
name = "ai-automate-script"
version = "1.0.0"
description = "游戏环境自主 Agent 研究框架：Environment 三方法抽象（capture/act/check）+ SoM 编号感知 + LLM 单步决策闭环"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Automate Team"}
]
keywords = ["automation", "agent", "llm", "benchmark", "vision"]

# 核心只依赖传输与图像基础能力；GUI/OCR/游戏依赖按 extras 安装
dependencies = [
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# OCR 感知：RapidOCR 优先（模型随 wheel 分发，零网络依赖）
vision = [
    "numpy>=1.26.0",
    "rapidocr_onnxruntime>=1.3.0",
    "opencv-python>=4.9.0",
]
# easyocr 仅作为 RapidOCR 不可用时的回退
vision-easyocr = [
    "easyocr>=1.7.0",
]
# 真实窗口截屏与键鼠注入
window = [
    "mss>=9.0.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
]
# 无头扫雷任务
minesweeper = [
    "pygame>=2.5.0",
]
# 跑无头 benchmark 的最小组合
benchmark = [
    "pygame>=2.5.0",
    "numpy>=1.26.0",
    "rapidocr_onnxruntime>=1.3.0",
    "opencv-python>=4.9.0",
]
all = [
    "easyocr>=1.7.0",
    "numpy>=1.26.0",
    "rapidocr_onnxruntime>=1.3.0",
    "opencv-python>=4.9.0",
    "mss>=9.0.0",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pygame>=2.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# 扫雷游戏本体保留在仓库根目录，随包一起安装，供无头环境导入
py-modules = ["minesweeper"]

[tool.setuptools.packages.find]
include = ["game_agent*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
